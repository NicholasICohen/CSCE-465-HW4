services:
    agent-node:
        build: ./agent-node
        container_name: agent-node
        networks:
            hw4net:
                ipv4_address: 172.30.0.10
        
    mock-c2:
        build: ./mock-c2
        container_name: mock-c2
        volumes:
            - ./mock-c2/data:/data
        networks:
            hw4net:
                ipv4_address: 172.30.0.66
        ports:
            - "8080:8080"
        
    web-lab:
        build: ./web-lab
        container_name: web-lab
        networks:
            hw4net:
                ipv4_address: 172.30.0.40
        ports:
            - "8000:8000"
        
networks:
    hw4net:
        driver: bridge
        driver_opts:
            com.docker.network.bridge.name: br-hw4
        ipam:
            config:
                - subnet: 172.30.0.0/24
